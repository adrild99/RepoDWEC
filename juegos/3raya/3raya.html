<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 en Raya — Game Hub</title>
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="3raya.css">

</head>
<body>
    <!-- Componente para Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark py-3 sticky-top">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand" href="../../index.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                    <circle cx="8" cy="8" r="1.3" fill="currentColor"></circle>
                    <circle cx="16" cy="8" r="1.3" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="1.3" fill="currentColor"></circle>
                    <circle cx="8" cy="16" r="1.3" fill="currentColor"></circle>
                    <circle cx="16" cy="16" r="1.3" fill="currentColor"></circle>
                </svg>
                Game Hub
            </a>
        </div>
    </nav>

    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 text-center">
                <h1>3 en Raya</h1>
                <p class="lead mb-4">Juega por turnos: coloca tu ficha y gana si consigues alinear tres en raya.</p>

                <div class="row row-cols-3 g-2" id="tablero">
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="0"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="1"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="2"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="3"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="4"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="5"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="6"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="7"></button></div>
                    <div class="col"><button type="button" class="btn btn-outline-secondary w-100 h-100 fs-1 celda" data-celda="8"></button></div>
                </div>

                <p class="mt-4 fs-5">Turno de: <span id="turno-actual" class="fw-bold">X</span></p>
                <p id="mensaje-final" class="fs-5 fw-bold"></p>
                <button type="button" id="btn-reiniciar" class="btn btn-primary w-100">Reiniciar</button>
            </div>
        </div>
    </section>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="3raya.js"></script>
</body>
</html>
